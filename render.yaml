# Render Blueprint: free backup deployment of Kulavazha Radar.
# Free web services sleep after ~15 min idle; the first visit then takes about a minute to wake.
# SARVAM_API_KEY is entered in the Render dashboard (sync: false), never committed.
services:
  - type: web
    name: kulavazha-radar
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_LLM_MODEL
        value: sarvam-105b
      - key: SARVAM_TTS_MODEL
        value: bulbul:v3
      - key: SARVAM_TTS_SPEAKER
        value: anand
